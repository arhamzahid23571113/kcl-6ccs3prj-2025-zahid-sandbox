[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "kcl6ccs3prj"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["torch>=2.2", "torchvision>=0.17", "tqdm>=4.65", "numpy>=1.24", "pandas>=2.0", "captum>=0.7"]
description = "6CCS3PRJ — Explanations & One-Pixel Attacks (CIFAR-10)"

[project.scripts]
kcl-run-one-pixel = "scripts.run_one_pixel:main"
kcl-explain = "scripts.run_explanations:main"
kcl-sum-expl = "scripts.summarize_explanations:main"
kcl-sum-targeted = "scripts.summarize_targeted_any:main"

[tool.hatch.build.targets.wheel]
packages = ["attacks", "explanations", "scripts"]

[tool.isort]
profile = "black"
line_length = 88
